[package]
name = "navguard"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CPI-enforceable Token-2022 NAV guard for Solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "navguard"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.2.0"
navguard-core = { path = "../../crates/navguard-core" }
spl-token-2022-interface = "3.1.1"
